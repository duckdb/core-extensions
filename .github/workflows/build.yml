#
# Builds (and optionally deploys) a single core extension from its extensions/<name>/description.yml, using the
# build.yml and deploy.yml reusable workflows from duckdb/extension-ci-tools
#
name: Core Extension Build
on:
  pull_request:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build.yml'
      - '!extensions/*/description.yml'
  push:
    paths-ignore:
      - '**'
      - '!scripts/build.py'
      - '!.github/workflows/build.yml'
      - '!extensions/*/description.yml'
  workflow_dispatch:
    inputs:
      extension_name:
        description: 'Extension to build (name of the folder in extensions/)'
        type: string
      duckdb_version:
        description: 'DuckDB version to build against (default: latest stable)'
        type: string
      duckdb_commit:
        description: 'Exact DuckDB commit to build against (default: the commit duckdb_version points at)'
        type: string
      extension_repository:
        description: 'Override the extension repository from description.yml (e.g. duckdb/duckdb-httpfs)'
        type: string
      extension_version:
        description: 'Override the extension ref from description.yml (tag, branch or commit)'
        type: string
      platform:
        description: 'Platform to build (e.g. linux_amd64)'
        required: true
        type: string
      deploy:
        description: "Set to 'false' to skip deployment"
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      extension_name:
        type: string
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      extension_repository:
        type: string
      extension_version:
        type: string
      platform:
        type: string
      deploy:
        type: string
      skip_tests:
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    outputs:
      COMMUNITY_EXTENSION_NAME: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_NAME }}
      COMMUNITY_EXTENSION_GITHUB: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_GITHUB }}
      COMMUNITY_EXTENSION_REF: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_REF }}
      COMMUNITY_EXTENSION_DEPLOY: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_DEPLOY }}
      COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      COMMUNITY_EXTENSION_OPT_IN_PLATFORMS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      COMMUNITY_EXTENSION_GROUPS: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_GROUPS }}
      COMMUNITY_EXTENSION_VCPKG_URL: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL == '' && 'https://github.com/microsoft/vcpkg.git' || steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      COMMUNITY_EXTENSION_VCPKG_COMMIT: ${{ steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT == '' && 'cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3' || steps.parse.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT }}
      runners: ${{ steps.runners.outputs.runners }}
    env:
      DUCKDB_LATEST_STABLE: 'v1.3.0'
      DUCKDB_VERSION: ${{ inputs.duckdb_version || 'v1.3.0' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect runners
      id: runners
      uses: duckdb/duckdb-ci/detect-runners@main

    - name: Get all changed description files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          extensions/*/description.yml

    - name: Parse description files
      id: parse
      env:
        ALL_CHANGED_FILES: ${{ github.event_name == 'workflow_dispatch' && format('extensions/{0}/description.yml', inputs.extension_name) || steps.changed-files.outputs.all_changed_files }}
        EXTENSION_REPOSITORY: ${{ inputs.extension_repository }}
        EXTENSION_VERSION: ${{ inputs.extension_version }}
        PLATFORM: ${{ inputs.platform }}
        PIP_BREAK_SYSTEM_PACKAGES: 1
      run: |
        pip install pyyaml
        # scripts/build.py takes DUCKDB_VERSION, EXTENSION_REPOSITORY, EXTENSION_VERSION and PLATFORM from environment
        python scripts/build.py
        cat env.sh >> "$GITHUB_OUTPUT"
        cat "$GITHUB_OUTPUT"

  build:
    name: Build extension
    needs: prepare
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    if: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME != '' }}
    secrets: inherit
    with:
      duckdb_version: ${{ inputs.duckdb_version || 'v1.3.0' }}
      duckdb_commit: ${{ inputs.duckdb_commit }}
      ci_tools_version: 'main'
      groups: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GROUPS }}
      extension_repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      extension_ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
      exclude_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_EXCLUDE_PLATFORMS }}
      opt_in_archs: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_OPT_IN_PLATFORMS }}
      runners: ${{ needs.prepare.outputs.runners }}
      vcpkg_url: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_URL }}
      vcpkg_commit: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_VCPKG_COMMIT }}
      skip_tests: ${{ inputs.skip_tests || false }}

  deploy:
    name: Deploy extension
    needs:
      - prepare
      - build
    uses: duckdb/extension-ci-tools/.github/workflows/deploy.yml@main
    if: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_DEPLOY != '' && inputs.deploy != 'false' }}
    secrets: inherit
    with:
      duckdb_version: ${{ needs.build.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.build.outputs.duckdb_commit }}
      ci_tools_version: 'main'
      extension_repository: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_GITHUB }}
      extension_ref: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_REF }}
      deploy_extensions: ${{ needs.prepare.outputs.COMMUNITY_EXTENSION_NAME }}
      deploy_latest: true
      deploy_versioned: true
